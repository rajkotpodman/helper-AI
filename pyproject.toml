[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helper-ai"
version = "1.0.0"
description = "Autonomous AI Agent with Full PC & Internet Control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Helper-AI Contributors", email = "rajkotpodman@github.com" }
]
keywords = [
    "ai-agent",
    "autonomous-agent",
    "pc-control",
    "automation",
    "llm",
    "fastapi",
    "powershell"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "aiohttp>=3.9.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.20.0",
    "google-genai>=0.1.1",
    "websockets>=12.0",
    "selenium>=4.18.0",
    "webdriver-manager>=4.0.0",
    "pyautogui>=0.9.54",
    "edge-tts>=6.1.10",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "flake8>=7.0.0"
]

[project.scripts]
helper-ai = "helper:main"
helper-server = "app:run_server"

[project.urls]
Homepage = "https://github.com/rajkotpodman/helper-AI"
Repository = "https://github.com/rajkotpodman/helper-AI"
Issues = "https://github.com/rajkotpodman/helper-AI/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
