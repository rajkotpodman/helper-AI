name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot python3-tk python3-dev libx11-dev xclip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Syntax and Import Check (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "import app, helper, core.agent; print('All core modules imported cleanly on Windows!')"

      - name: Run Syntax and Import Check with Virtual Framebuffer (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -c "import app, helper, core.agent; print('All core modules imported cleanly on Linux!')"

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest tests/ -v

      - name: Run Test Suite with Virtual Framebuffer (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pytest tests/ -v

  build-wetware-hub:
    name: Build AI 2026 Wetware Hub (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ai_2026_hub/package.json'

      - name: Install dependencies
        working-directory: ai_2026_hub
        run: npm install

      - name: Verify Production Build
        working-directory: ai_2026_hub
        run: npm run build

