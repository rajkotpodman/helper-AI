version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain React & TypeScript dependencies for AI 2026 Wetware Hub
  - package-ecosystem: "npm"
    directory: "/ai_2026_hub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
