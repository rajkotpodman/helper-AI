name: "✨ Feature Request"
description: "Suggest a new capability, tool, or improvement for Helper-AI"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Helper-AI even more autonomous and powerful? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Opportunity"
      description: "Is your feature request related to a problem or new automation flow?"
      placeholder: "I'm always frustrated when I need to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Add a new tool for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you've considered."

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Add screenshots, workflow diagrams, or links to references."
