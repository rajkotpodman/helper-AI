repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2000']
        exclude: ^(ai_2026_hub/dist|rea_repo|livekit_repo)/

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        exclude: ^(\.venv|build|dist|rea_repo|livekit_repo|frameworks|ai_2026_hub)/

